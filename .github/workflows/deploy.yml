name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run lint
        run: flake8 .

      - name: Build Docker image
        run: docker build -t flask-backend .
